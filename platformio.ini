[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = -Wall -Wextra

; Unit tests for the Arduino-free modules: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<bans.cpp> +<at.cpp>
